packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.60.0'
  - '@typescript-eslint/parser@8.60.0'
  - '@typescript-eslint/project-service@8.60.0'
  - '@typescript-eslint/scope-manager@8.60.0'
  - '@typescript-eslint/tsconfig-utils@8.60.0'
  - '@typescript-eslint/type-utils@8.60.0'
  - '@typescript-eslint/types@8.60.0'
  - '@typescript-eslint/typescript-estree@8.60.0'
  - '@typescript-eslint/utils@8.60.0'
  - '@typescript-eslint/visitor-keys@8.60.0'
  - typescript-eslint@8.60.0
  - postcss@8.5.10
  - brace-expansion@2.1.4
  - '@hookform/resolvers@5.9.0'
  - react-email@6.9.3
  - '@react-email/ui@6.9.3'
# GHSA-mh99-v99m-4gvg declares a single flat range (<=5.0.7) with no branch for
# the 2.x line, so the backported fix in brace-expansion@2.1.4 still trips the
# audit. We are on 2.1.4 (minimatch@9) and 5.0.8 (minimatch@10) - both patched.
# minimatch@9 cannot take 5.x: it default-imports brace-expansion, and 5.x only
# exports `expand` as a named export. Drop this once GitHub splits the range.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
overrides:
  postcss@<8.5.10: ^8.5.10
  # Pinned exactly, not a caret range. `@react-email/ui` ships a Next.js traced
  # copy of the esbuild JS host inside its prebuilt `.next` output, and that copy
  # cannot be upgraded from here. The host refuses to run against a platform
  # binary of a different version, so a range that resolves higher breaks the
  # email preview server with "Host version X does not match binary version Y".
  # Raise this only in step with the version `@react-email/ui` was built against.
  esbuild: 0.28.1
  sharp@<0.35.0: ^0.35.3
  minimatch@9>brace-expansion: ^2.1.4
