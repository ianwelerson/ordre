name: Vercel Deploy

on:
  workflow_call:
    inputs:
      IS_PROD:
        required: true
        type: boolean
      VERCEL_PROJECT_ID_KEY:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      IS_PROD:
        description: "Is a production deployment?"
        required: true
        type: boolean
      VERCEL_PROJECT_ID_KEY:
        description: "Key name for the Vercel Project"
        required: true
        type: string

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets[inputs.VERCEL_PROJECT_ID_KEY] }}
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  vercel-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install Vercel CLI
        run: npm install --global vercel@^51.7.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ inputs.IS_PROD == true && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Environment Variables
        run: vercel env pull .env --environment=${{ inputs.IS_PROD == true && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build ${{ inputs.IS_PROD == true && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt ${{ inputs.IS_PROD == true && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
