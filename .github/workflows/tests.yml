name: Tests

on: [workflow_call, workflow_dispatch]

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  runs-tests:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for the integration tests. It exists only for this job,
    # so the harness is free to migrate, truncate, and seed it (see
    # apps/api/src/test/global-setup.ts). NEVER point tests at a real database -
    # the integration setup TRUNCATEs every table.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordre-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install

      # The two-role split from Setup -> Database Roles & RLS. It is a manual,
      # one-time step per database, so the ephemeral CI database needs it too:
      # without a weak, non-owner role the API would connect as the owner and
      # silently bypass every policy, making the RLS tests pass for free.
      # The password is throwaway - this database dies with the job.
      - name: Bootstrap database roles
        run: |
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE ordre_app LOGIN PASSWORD 'ordre_app';
            GRANT CONNECT ON DATABASE "ordre-test" TO ordre_app;
            GRANT USAGE ON SCHEMA public TO ordre_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ordre_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ordre_app;
            -- Covers the tables the migrations create later in the job.
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ordre_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO ordre_app;
          SQL
        env:
          DATABASE_OWNER_URL: postgresql://postgres:postgres@localhost:5432/ordre-test

      - name: Run Tests
        run: pnpm test:unit:ci
        env:
          # "Test env" for CI: ambient vars stand in for the (gitignored) .env.test.
          # env.ts falls back to these when no file is present.
          APP_STAGE: test
          NODE_ENV: test
          # Runtime connection - the restricted role, so RLS is actually enforced.
          DATABASE_URL: postgresql://ordre_app:ordre_app@localhost:5432/ordre-test
          # Owner connection - migrations, TRUNCATE and seeding (see src/test/owner-db.ts).
          DATABASE_OWNER_URL: postgresql://postgres:postgres@localhost:5432/ordre-test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      # - name: Run E2E Tests
      #   run: pnpm run test:e2e:ci
